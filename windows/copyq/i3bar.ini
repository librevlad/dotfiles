[General]
css_template_items=items
css_template_main_window=main_window
css_template_menu=menu
css_template_notification=notification

style_main_window=true
show_number=true
show_scrollbars=false
font_antialiasing=true
use_system_icons=false

icon_size=12
item_spacing=0
num_margin=2

font="FiraCode Nerd Font,11,-1,5,50,0,0,0,0,0"
find_font="FiraCode Nerd Font,11,-1,5,50,0,0,0,0,0"
num_font="FiraCode Nerd Font,8,-1,5,50,0,0,0,0,0"
edit_font="FiraCode Nerd Font,11,-1,5,50,0,0,0,0,0"
notes_font="FiraCode Nerd Font,11,-1,5,50,0,0,0,0,0"
notification_font="FiraCode Nerd Font,11,-1,5,50,0,0,0,0,0"

bg=#2d323d
fg=#ffffff
alt_bg=#323845
sel_bg=#3d4453
sel_fg=#a4dbdb
find_bg=#a4dbdb
find_fg=#2d323d
edit_bg=#323845
edit_fg=#ffffff
notes_bg=#3d4453
notes_fg=#ffffff
num_fg=#606a82
num_sel_fg=#a4dbdb
notification_bg=#2d323d
notification_fg=#ffffff

css=

menu_bar_css="
    ;background: ${bg}
    ;color: ${fg}
    ;padding: 0.15em
    ;border-radius: 5%"
menu_bar_disabled_css=
menu_bar_selected_css="
    ;background: ${sel_bg}
    ;color: ${fg}"
menu_css="
    ;background: ${alt_bg}
    ;color: ${fg}
    ;border: 1px solid ${sel_bg}"

tool_bar_css="
    ;background: ${bg}
    ;color: ${fg}
    ;border: 0"
tool_button_css="
    ;background: ${bg}
    ;color: ${fg}
    ;font-weight: normal
    ;border: 0
    ;border-radius: 5%"
tool_button_pressed_css="
    ;background: ${num_fg}"
tool_button_selected_css="
    ;background: ${sel_bg}
    ;color: ${sel_fg}"

search_bar="
    ;background: ${find_bg}
    ;color: ${bg}
    ;margin: 0.2em 0 0.1em 0
    ;padding: 0.2em 0 0.2em 0
    ;border: 1px solid ${find_bg}"
search_bar_focused="
    ;margin: 0.2em 0 0.1em 0
    ;padding: 0.2em 0 0.2em 0
    ;border: 1px solid ${sel_bg}"

tab_bar_css="
    ;background: ${bg}"
tab_bar_item_counter="
    ;color: #f08080
    ;font-size: 6pt"
tab_bar_scroll_buttons_css="
    ;background: ${bg}
    ;color: ${fg}
    ;border: 0"
tab_bar_sel_item_counter="
    ;color: #f08080"
tab_bar_tab_unselected_css="
    ;background: ${bg}
    ;color: ${num_fg}
    ;padding: 0.2em
    ;border: 1px solid ${bg}"
tab_bar_tab_selected_css="
    ;background: ${alt_bg}
    ;color: ${fg}
    ;padding: 0.2em
    ;border: 1px solid ${num_fg}
    ;border-radius: 5%"

tab_tree_css="
    ;background: ${bg}
    ;color: ${num_fg}"
tab_tree_item_counter="
    ;color: #f08080
    ;font-size: 6pt"
tab_tree_sel_item_counter="
    ;color: #f08080"
tab_tree_sel_item_css="
    ;background: ${bg}
    ;color: ${fg}
    ;text-decoration: underline"

item_css="
    ;padding: 0.3em 0.5em 0.5em 0.5em"
alt_item_css=
sel_item_css=
cur_item_css="
    ;border: 1px solid ${sel_bg}"
hover_item_css="
    ;background: #3a4050"
notes_css=
