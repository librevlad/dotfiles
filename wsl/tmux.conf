# roles/linux-base/files/tmux/tmux.conf for tmux 3.x (Ubuntu 24.04 in WSL).
# Same bindings; dropped: powerline (python2.7 bindings). Colours from adio.tmuxcolors in the 3.x "-style" syntax.

# Smart pane switching with awareness of vim splits (vim-tmux-navigator)
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"
bind -n 'C-\' if-shell "$is_vim" "send-keys 'C-\\'" "select-pane -l"
bind C-l send-keys 'C-l'

# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# split panes using | and -
unbind '"'
unbind %
bind | split-window -h
bind - split-window -v

bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"
set-option -g mouse on
set-option -g allow-rename off
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# COLOURS (adio.tmuxcolors)
set -g status-style fg=colour250,bg=colour234
set -g status-left-style fg=colour250,bg=default
set -g status-right-style fg=colour240,bg=default
setw -g window-status-style fg=colour240,bg=default
setw -g window-status-current-style fg=colour252,bg=default
set -g pane-border-style fg=colour235
set -g pane-active-border-style fg=colour235
set -g message-style fg=colour232,bg=colour32
set -g mode-style fg=colour232,bg=colour32
